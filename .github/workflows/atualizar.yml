name: Atualizar dados do Showroom

on:
  schedule:
    # Dias 03 e 15 de cada mês, às 08:00 (horário de Brasília) = 11:00 UTC
    - cron: "0 11 3,15 * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler planilha e gerar data.json
        run: python atualizar.py
      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "Sem mudanças" || (git commit -m "Atualiza dados do Showroom ($(date +%d/%m/%Y))" && git push)
